{% extends 'base.html' %}
{% block title %}Корзина{% endblock %}

{% block header_left %}
<a href="/" class="back-in-header">← Назад в меню</a>
{% endblock %}

{% block content %}

<div id="cart-container" class="cart-modern">
    <div id="cart-items-list"></div>
    <div id="cart-total" class="cart-total">Итого: 0 сом</div>
    <div class="delivery-form">
        <h3>Информация для доставки</h3>
        <input type="text" id="name" placeholder="Ваше имя *">
        <input type="tel" id="phone" placeholder="Номер телефона *">
        <input type="text" id="address" placeholder="Адрес доставки *">
        <button id="checkout-wa-btn" class="btn-gold" style="width:100%;">📲 Оформить через WhatsApp</button>
    </div>
</div>

<style>
    :root {
        --gold: #f5b700;
        --gold-light: #ffde9e;
        --gold-dark: #dc9e00;
        --text-muted: #7f6e5b;
    }
    .cart-modern {
        background: white;
        border-radius: 32px;
        padding: 24px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        border: 1px solid #fff0cf;
    }
    .cart-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #ffecb3;
        padding: 16px 0;
        flex-wrap: wrap;
    }
    .cart-item-info {
        flex: 2;
    }
    .cart-actions {
        display: flex;
        gap: 12px;
        align-items: center;
    }
    .cart-actions button {
        background: #faf3e0;
        border: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
    }
    .cart-total {
        text-align: right;
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--gold-dark);
        margin: 20px 0 30px;
        padding-top: 15px;
        border-top: 2px solid #f5b700;
    }
    .delivery-form {
        background: #fffef5;
        border-radius: 24px;
        padding: 24px;
        margin-top: 20px;
    }
    .delivery-form input {
        width: 100%;
        padding: 14px 18px;
        margin: 10px 0;
        border: 1px solid #ffdd99;
        border-radius: 60px;
        background: white;
        font-size: 1rem;
    }
    .delivery-form input:focus {
        outline: none;
        border-color: var(--gold);
        box-shadow: 0 0 0 2px rgba(245,183,0,0.2);
    }
    .btn-gold {
        background: var(--gold);
        border: none;
        padding: 12px 24px;
        border-radius: 60px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }
    .btn-gold:hover {
        background: var(--gold-dark);
        color: white;
    }
    @media (max-width: 600px) {
        .cart-item {
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }
        .cart-actions {
            align-self: flex-end;
            margin-top: 8px;
        }
        .cart-total {
            font-size: 1.3rem;
        }
        .delivery-form {
            padding: 18px;
        }
        .cart-modern {
            padding: 16px;
        }
        .page-title {
            font-size: 1.6rem;
        }
    }
</style>

<script>
    function loadCart() {
        fetch('/cart/')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('cart-items-list');
                if (!data.items.length) {
                    container.innerHTML = '<p style="text-align:center;">Корзина пуста. <a href="/">Перейти в меню</a></p>';
                    document.getElementById('cart-total').innerText = 'Итого: 0 сом';
                    return;
                }
                let html = '';
                data.items.forEach(item => {
                    html += `
                        <div class="cart-item" data-id="${item.id}">
                            <div class="cart-item-info">
                                <strong>${escapeHtml(item.name)}</strong><br>
                                <small>${item.price} сом × <span class="qty-display">${item.quantity}</span> шт</small>
                            </div>
                            <div class="cart-actions">
                                <button class="qty-minus" data-id="${item.id}">−</button>
                                <span class="qty-value">${item.quantity}</span>
                                <button class="qty-plus" data-id="${item.id}">+</button>
                                <button class="remove-btn" data-id="${item.id}">🗑️</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                document.getElementById('cart-total').innerText = `Итого: ${data.total} сом`;
                attachCartEvents();
            });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function attachCartEvents() {
        document.querySelectorAll('.qty-minus').forEach(btn => {
            btn.onclick = () => updateQuantity(btn.getAttribute('data-id'), -1);
        });
        document.querySelectorAll('.qty-plus').forEach(btn => {
            btn.onclick = () => updateQuantity(btn.getAttribute('data-id'), 1);
        });
        document.querySelectorAll('.remove-btn').forEach(btn => {
            btn.onclick = () => removeItem(btn.getAttribute('data-id'));
        });
    }

    function updateQuantity(productId, delta) {
        fetch('/cart/')
            .then(res => res.json())
            .then(data => {
                let currentQty = data.items.find(i => i.id == productId)?.quantity || 0;
                let newQty = currentQty + delta;
                if (newQty <= 0) {
                    removeItem(productId);
                } else {
                    fetch('/api/update-cart/', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
                        body: JSON.stringify({product_id: productId, quantity: newQty})
                    })
                    .then(res => res.json())
                    .then(() => { loadCart(); updateCartCount(); });
                }
            });
    }

    function removeItem(productId) {
        fetch('/api/remove-from-cart/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
            body: JSON.stringify({product_id: productId})
        })
        .then(res => res.json())
        .then(() => { loadCart(); updateCartCount(); });
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
function sendOrderToWhatsApp() {
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();
    if (!name || !phone || !address) {
        alert('Заполните все поля!');
        return;
    }
    fetch('/cart/')
        .then(res => res.json())
        .then(data => {
            if (data.items.length === 0) {
                alert('Корзина пуста');
                return;
            }
            let itemsText = '';
            data.items.forEach(item => {
                itemsText += `• ${item.name} × ${item.quantity} = ${item.subtotal} сом\n`;
            });
            const msg = `🍕 *Новый заказ*\n\n👤 Имя: ${name}\n📞 Телефон: ${phone}\n🏠 Адрес: ${address}\n\n📋 Состав:\n${itemsText}\n💰 Итого: ${data.total} сом`;
            const encodedMsg = encodeURIComponent(msg);
            const phoneNumber = '996555181618'; // ваш номер (без +)

            // Определяем, мобильное ли устройство
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            let url;
            if (isMobile) {
                // Прямой вызов приложения через схему whatsapp://
                url = `whatsapp://send?phone=${phoneNumber}&text=${encodedMsg}`;
            } else {
                url = `https://wa.me/${phoneNumber}?text=${encodedMsg}`;
            }

            // Переход
            window.location.href = url;

            // Запасной вариант — если не открылось, через 1.5 сек открываем web-версию
            setTimeout(() => {
                if (document.hasFocus()) {
                    window.location.href = `https://wa.me/${phoneNumber}?text=${encodedMsg}`;
                }
            }, 1500);

            // Очистка корзины через 2 секунды (чтобы не мешать открытию)
            setTimeout(() => {
                if (confirm('Заказ отправлен. Очистить корзину?')) {
                    fetch('/api/clear-cart/', { method: 'POST', headers: { 'X-CSRFToken': getCookie('csrftoken') } })
                        .then(() => { loadCart(); updateCartCount(); });
                }
            }, 2000);
        });
}
    document.getElementById('checkout-wa-btn').addEventListener('click', sendOrderToWhatsApp);
    document.addEventListener('DOMContentLoaded', () => { loadCart(); updateCartCount(); });
</script>
{% endblock %}
